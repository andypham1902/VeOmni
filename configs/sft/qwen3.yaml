model:
  model_path: /mnt/sharefs/tuenv/model_hub/qwen3/qwen3-4b
  attn_implementation: flash_attention_2
  tokenizer_path: /mnt/sharefs/tuenv/model_hub/qwen3/qwen3-4b
  # rope_scaling:
  #   rope_type: "dynamic"
  #   factor: 3.2

data:
  train_path: /home/slurm/hoanganh/VeOmni/_data/musique_concatenated.arrow
  val_path: /home/slurm/hoanganh/VeOmni/_data/test_simpleqa_frames.parquet
  data_type: conversation
  chat_template: chatml
  max_seq_len: 16384
  text_keys: prompt
  dataloader_type: native
  datasets_type: mapping
  # num_workers: 2     # Reduced to save memory
  # prefetch_factor: 2  # Reduced to save memory
  train_size: 485133  # Total number of training samples

train:
  output_dir: /mnt/sharefs/hoanganh/ckpts/qwen3_4b_tools
  data_parallel_mode: fsdp1
  ulysses_parallel_size: 1  # Keep disabled for stability
  global_batch_size: 32
  micro_batch_size: 1       
  # Gradient accumulation: 64/(1*8) = 8 steps per GPU
  rmpad: false
  rmpad_with_pos_ids: true
  num_train_epochs: 5
  bsz_warmup_ratio: 0.0  # Disable batch size warmup
  dyn_bsz_margin: 0      # Reduced margin to allow more samples
  dyn_bsz_buffer_size: 200  # Increase buffer size significantly
  optimizer: adamw
  lr: 1.0e-5              # Conservative learning rate for stable SFT
  lr_warmup_ratio: 0.1    # 10% warmup for better stability
  lr_decay_style: cosine
  lr_decay_ratio: 0.5
  weight_decay: 0.001      # Reduced weight decay to prevent high gradient norms
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  enable_fsdp_offload: false
  enable_activation_offload: false  # Disable to avoid issues
  init_device: meta  # Use cuda initialization
  enable_full_determinism: false
  empty_cache_steps: 1999  # Clear cache every 50 steps to prevent OOM
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 2000
  save_hf_weights: true
  use_wandb: true
  wandb_project: veomni_tools
  wandb_name: qwen3_4b_sft_500k_fix_fix
  validation_steps: 2000
  enable_tool_validation: true
  max_agent_turns: 15             # More turns for complex reasoning
  tool_call_timeout: 60          # Longer timeout for tool execution
  agent_total_timeout: 300       # 5 minutes total timeout per sample